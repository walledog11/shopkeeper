name: Evals

on:
  push:
    branches: [master]
    paths:
      - 'packages/agent/**'
      - 'apps/dashboard/src/lib/agent/**'
      - 'apps/dashboard/src/lib/messaging/**'
      - 'apps/gateway/src/order-ops.eval.test.ts'
      - 'packages/db/refund-spend.ts'
      - 'scripts/eval-budget-preflight.mjs'
      - '.github/workflows/evals.yml'
  pull_request:
    paths:
      - 'packages/agent/**'
      - 'apps/dashboard/src/lib/agent/**'
      - 'apps/dashboard/src/lib/messaging/**'
      - 'apps/gateway/src/order-ops.eval.test.ts'
      - 'packages/db/refund-spend.ts'
      - 'scripts/eval-budget-preflight.mjs'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release gate or targeted diagnosis'
        type: choice
        options: [release, targeted]
        default: release
      fixtures:
        description: 'Comma-separated fixture IDs (required for targeted mode)'
        type: string
        default: ''
      repeats:
        description: 'Targeted repeats per fixture'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      judges:
        description: 'Enable all semantic judges in targeted mode'
        type: choice
        options: ['off', 'on']
        default: 'off'
      max_usd:
        # Run 34541492999 died at $0.7031/$0.70 with 47 of 49 core fixtures
        # done and 16 of its 114 calls unspent: the binding constraint is
        # dollars, not calls, and the preflight's per-call estimate runs about
        # 9% light against what the core suite actually costs. Measured
        # 2026-09-10 at 49 core fixtures, release mode, judges off.
        description: 'Approved total spend allocation across dashboard and gateway jobs'
        type: string
        required: true
        default: '0.90'
      max_model_calls:
        description: 'Hard total model-call allocation across dashboard and gateway jobs'
        type: string
        required: true
        default: '120'

# Pushes to master and pull requests run only the free preflight. Every paid
# invocation is manual, has an explicit dollar/call ceiling, and is never
# cancelled or retriggered.
concurrency:
  group: evals-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  deterministic-preflight:
    name: Free deterministic eval preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build workspace package exports used by eval controls
        # Ordered by turbo from each package's own dependencies, never by a list
        # here — a hand-maintained sequence is a second copy of the dependency
        # graph and goes stale the moment a package gains a workspace dependency.
        run: npx turbo run build --filter="./packages/*"
      - name: Validate shared cost accounting and fixture controls
        run: |
          npm run test:unit -w packages/agent
          npm run test:unit -w apps/dashboard -- --run src/lib/agent/__evals__/runner.unit.test.ts src/lib/agent/__evals__/selection.unit.test.ts src/lib/agent/__evals__/fixture-validator.unit.test.ts src/lib/agent/__evals__/result-cache.unit.test.ts
      - name: Start test services
        run: npm run test:services:up
      - name: Bootstrap test database
        run: node ./scripts/test-bootstrap.mjs
      - name: Run dashboard harness checks without model calls
        run: npm run test:integration -w apps/dashboard -- --run src/lib/agent/__evals__/harness.integration.test.ts
      - name: Run deterministic gateway pre-filter without model calls
        run: npm run test:integration -w apps/gateway -- --run src/order-ops.eval.test.ts -t 'order-ops deterministic pre-filter'
      - name: Stop test services
        if: always()
        run: npm run test:services:down

  budget-preflight:
    name: Approve and allocate paid eval budget
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      dashboard_max_usd: ${{ steps.budget.outputs.dashboard_max_usd }}
      dashboard_max_calls: ${{ steps.budget.outputs.dashboard_max_calls }}
      gateway_max_usd: ${{ steps.budget.outputs.gateway_max_usd }}
      gateway_max_calls: ${{ steps.budget.outputs.gateway_max_calls }}
      estimated_usd: ${{ steps.budget.outputs.estimated_usd }}
      estimated_calls: ${{ steps.budget.outputs.estimated_calls }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an underfunded or malformed run before contacting a model
        id: budget
        # Dispatch inputs reach the shell through env, never through `${{ }}` in
        # the script body: an expression is substituted before bash parses the
        # line, so a quote inside `fixtures` ends the string and the rest of the
        # input runs as shell. `mode`, `repeats` and `judges` are choice inputs
        # that GitHub constrains, but they travel the same way so the rule holds
        # with no exception to remember.
        env:
          MODE: ${{ inputs.mode }}
          REPEATS: ${{ inputs.repeats }}
          JUDGES: ${{ inputs.judges }}
          FIXTURES: ${{ inputs.fixtures }}
          MAX_USD: ${{ inputs.max_usd }}
          MAX_MODEL_CALLS: ${{ inputs.max_model_calls }}
        run: |
          mode="$MODE"
          repeats="$REPEATS"
          judges="$JUDGES"
          if [ "$mode" = release ]; then repeats=1; judges=off; fi
          node scripts/eval-budget-preflight.mjs \
            --mode "$mode" \
            --fixtures "$FIXTURES" \
            --repeats "$repeats" \
            --judges "$judges" \
            --max-usd "$MAX_USD" \
            --max-calls "$MAX_MODEL_CALLS" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record approved maximums
        env:
          MODE: ${{ inputs.mode }}
          ESTIMATED_CALLS: ${{ steps.budget.outputs.estimated_calls }}
          ESTIMATED_USD: ${{ steps.budget.outputs.estimated_usd }}
          MAX_USD: ${{ inputs.max_usd }}
          MAX_MODEL_CALLS: ${{ inputs.max_model_calls }}
        run: |
          {
            echo '## Paid eval authorization'
            printf -- '- Mode: `%s`\n' "$MODE"
            printf -- '- Expected: **%s calls / $%s**\n' "$ESTIMATED_CALLS" "$ESTIMATED_USD"
            printf -- '- Hard allocation: **%s calls / $%s**\n' "$MAX_MODEL_CALLS" "$MAX_USD"
            echo '- No paid rerun is automatic.'
          } >> "$GITHUB_STEP_SUMMARY"

  targeted-dashboard:
    name: Targeted dashboard diagnosis
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'targeted'
    needs: [deterministic-preflight, budget-preflight]
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_SUITE: full
      EVAL_FIXTURE: ${{ inputs.fixtures }}
      EVAL_REPEATS: ${{ inputs.repeats }}
      RUN_JUDGE_EVALS: ${{ inputs.judges == 'on' && '1' || '0' }}
      EVAL_CONFIRM_HARD_FAILURES: '0'
      EVAL_MAX_USD: ${{ needs.budget-preflight.outputs.dashboard_max_usd }}
      EVAL_MAX_MODEL_CALLS: ${{ needs.budget-preflight.outputs.dashboard_max_calls }}
      EVAL_RESULT_CACHE_DIR: test-results/eval-cache
      REQUIRE_MODEL_EVALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/cache/restore@v4
        with:
          path: test-results/eval-cache
          key: eval-results-${{ runner.os }}-${{ github.sha }}-targeted-r${{ inputs.repeats }}-j${{ inputs.judges }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: eval-results-${{ runner.os }}-${{ github.sha }}-targeted-r${{ inputs.repeats }}-j${{ inputs.judges }}-
      - name: Require model credentials
        run: test -n "$ANTHROPIC_API_KEY" && test "$ANTHROPIC_API_KEY" != test-anthropic-key
      - run: npm ci
      - run: npm run test:services:up
      - run: node ./scripts/test-bootstrap.mjs
      - name: Run only selected fixtures
        run: |
          set -o pipefail
          npm run test:evals -w apps/dashboard 2>&1 | tee eval-output.log
      - name: Save reusable exact-commit passing evidence
        if: always()
        uses: actions/cache/save@v4
        with:
          path: test-results/eval-cache
          key: eval-results-${{ runner.os }}-${{ github.sha }}-targeted-r${{ inputs.repeats }}-j${{ inputs.judges }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload complete targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-dashboard-evidence
          path: |
            eval-output.log
            test-results/eval-report.log
            test-results/eval-ledger.jsonl
            test-results/eval-cache
          if-no-files-found: warn
      - if: always()
        run: npm run test:services:down

  release-dashboard:
    name: Paid release gate — dashboard core
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    needs: [deterministic-preflight, budget-preflight]
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_SUITE: core
      EVAL_REPEATS: '1'
      RUN_JUDGE_EVALS: '0'
      EVAL_CONFIRM_HARD_FAILURES: '2'
      EVAL_MAX_USD: ${{ needs.budget-preflight.outputs.dashboard_max_usd }}
      EVAL_MAX_MODEL_CALLS: ${{ needs.budget-preflight.outputs.dashboard_max_calls }}
      EVAL_RESULT_CACHE_DIR: test-results/eval-cache
      REQUIRE_MODEL_EVALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/cache/restore@v4
        with:
          path: test-results/eval-cache
          key: eval-results-${{ runner.os }}-${{ github.sha }}-release-r1-jgated-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: eval-results-${{ runner.os }}-${{ github.sha }}-release-r1-jgated-
      - name: Require model credentials
        run: test -n "$ANTHROPIC_API_KEY" && test "$ANTHROPIC_API_KEY" != test-anthropic-key
      - run: npm ci
      - run: npm run test:services:up
      - run: node ./scripts/test-bootstrap.mjs
      - name: Run 35 hard-gated core fixtures (2 recorded stochastic cases excluded from the gate)
        run: |
          set -o pipefail
          npm run test:evals -w apps/dashboard 2>&1 | tee eval-output.log
      - name: Require conclusive hard-gate and budget summaries
        run: |
          test -s eval-output.log
          grep -qE '^\[eval:gates\] hard-gated [1-9][0-9]*/[1-9][0-9]* \(100\.0%\)' eval-output.log
          grep -qE '^\[eval:budget\] spent=\$[0-9]' eval-output.log
      - name: Save reusable exact-commit passing evidence
        if: always()
        uses: actions/cache/save@v4
        with:
          path: test-results/eval-cache
          key: eval-results-${{ runner.os }}-${{ github.sha }}-release-r1-jgated-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload complete dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-dashboard-evidence
          path: |
            eval-output.log
            test-results/eval-report.log
            test-results/eval-ledger.jsonl
            test-results/eval-cache
          if-no-files-found: warn
      - if: always()
        run: npm run test:services:down

  release-gateway:
    name: Paid release gate — gateway hard case
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    needs: [deterministic-preflight, budget-preflight]
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_REPEATS: '1'
      EVAL_RETRY_HARD: '1'
      EVAL_MAX_USD: ${{ needs.budget-preflight.outputs.gateway_max_usd }}
      EVAL_MAX_MODEL_CALLS: ${{ needs.budget-preflight.outputs.gateway_max_calls }}
      REQUIRE_MODEL_EVALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Require model credentials
        run: test -n "$ANTHROPIC_API_KEY" && test "$ANTHROPIC_API_KEY" != test-anthropic-key
      - run: npm ci
      - run: npm run test:services:up
      - run: node ./scripts/test-bootstrap.mjs
      - name: Run clear-fraud hard gate with failed-case-only confirmation
        run: |
          set -o pipefail
          npm run test:evals -w apps/gateway -- -t 'clear-fraud-multi-signal' 2>&1 | tee gateway-eval.log
      - name: Require conclusive gateway and budget summaries
        run: |
          test -s gateway-eval.log
          grep -qE '\[order-ops-eval:gates\] clear-fraud (1/1|retries 2/2)' gateway-eval.log
          grep -qE '\[order-ops-eval:budget\] spent=\$[0-9]' gateway-eval.log
          grep -qE '\[order-ops-eval:usage\] in=[0-9]' gateway-eval.log
      - name: Upload complete gateway evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gateway-evidence
          path: |
            gateway-eval.log
            test-results/eval-ledger.jsonl
          if-no-files-found: warn
      - if: always()
        run: npm run test:services:down

  release-summary:
    name: Conclusive release-gate result
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    needs: [release-dashboard, release-gateway, budget-preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Report one paid invocation as pass or fail
        env:
          DASHBOARD_RESULT: ${{ needs.release-dashboard.result }}
          GATEWAY_RESULT: ${{ needs.release-gateway.result }}
          MAX_USD: ${{ inputs.max_usd }}
          MAX_MODEL_CALLS: ${{ inputs.max_model_calls }}
        run: |
          {
            echo '## Release eval conclusion'
            echo "- Dashboard: $DASHBOARD_RESULT"
            echo "- Gateway: $GATEWAY_RESULT"
            printf -- '- Approved maximum: %s / %s calls\n' "$MAX_USD" "$MAX_MODEL_CALLS"
            echo '- A failure is a blocker or targeted-diagnosis input; it does not trigger another paid run.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$DASHBOARD_RESULT" = success
          test "$GATEWAY_RESULT" = success

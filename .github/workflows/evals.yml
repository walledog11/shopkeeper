name: Evals

on:
  pull_request:
    paths:
      - 'packages/agent/**'
      - 'apps/dashboard/src/lib/agent/**'
      - 'apps/dashboard/src/lib/messaging/**'
      - 'apps/gateway/src/order-ops.eval.test.ts'
      - 'packages/db/refund-spend.ts'
      # `package.json` / `package-lock.json` are deliberately absent: a run costs
      # ~$0.48 in live model calls (measured 2026-08-19), and a dependency bump
      # cannot change planner behaviour. Bump the Anthropic SDK or a model pin
      # and dispatch this workflow by hand.
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Targeted diagnosis, full drift run, or three-run baseline regeneration'
        type: choice
        options: [targeted, full, baseline]
        default: full
      fixtures:
        description: 'Comma-separated fixture IDs (required for targeted mode)'
        type: string
        default: ''
      repeats:
        description: 'Targeted repeats per fixture'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      judges:
        description: 'Enable semantic judges for targeted mode'
        type: choice
        options: ['off', 'on']
        default: 'off'

# `pull_request` fires on `synchronize`, so without this every push to an open PR
# starts another ~$0.48 gate and lets the superseded one run to completion —
# paying to measure commits that no longer exist. Cancelling is scoped to PRs on
# purpose: a `workflow_dispatch` is someone deliberately buying a full drift run
# or a ~$2.55 three-repeat baseline, and must never be killed by a later one.
# The groups are distinct anyway (`refs/pull/N/merge` vs `refs/heads/...`), so
# this only guards dispatch-against-dispatch.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  targeted-dashboard:
    name: Targeted dashboard eval diagnosis
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'targeted'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_SUITE: full
      EVAL_FIXTURE: ${{ inputs.fixtures }}
      EVAL_REPEATS: ${{ inputs.repeats }}
      RUN_JUDGE_EVALS: ${{ inputs.judges == 'on' && '1' || '0' }}
      REQUIRE_MODEL_EVALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require fixture selection and model credentials
        run: |
          if [ -z "${EVAL_FIXTURE//[[:space:],]/}" ]; then
            echo "Targeted mode requires at least one fixture ID."
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ] || [ "$ANTHROPIC_API_KEY" = "test-anthropic-key" ]; then
            echo "ANTHROPIC_API_KEY must be configured with a real key."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Start test services
        run: npm run test:services:up
      - name: Bootstrap test database
        run: node ./scripts/test-bootstrap.mjs
      - name: Run selected dashboard fixtures
        run: |
          set -o pipefail
          npm run test:evals:fixture -w apps/dashboard 2>&1 | tee eval-output.log
      - name: Targeted eval summary
        if: always()
        run: |
          {
            echo "## Targeted dashboard eval results"
            echo '```'
            grep -E '^(\[eval(:summary|:gates|:cache|:usage)?\]|  [-~])' eval-output.log || echo "(targeted summary absent)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop test services
        if: always()
        run: npm run test:services:down

  core-dashboard:
    name: Core dashboard eval gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_SUITE: core
      EVAL_REPEATS: '1'
      REQUIRE_MODEL_EVALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require model credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ "$ANTHROPIC_API_KEY" = "test-anthropic-key" ]; then
            echo "ANTHROPIC_API_KEY must be configured with a real key; skipped model evals cannot pass."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Start test services
        run: npm run test:services:up
      - name: Bootstrap test database
        run: node ./scripts/test-bootstrap.mjs
      - name: Run each core fixture gate
        id: evals
        run: |
          set -o pipefail
          npm run test:evals -w apps/dashboard 2>&1 | tee eval-output.log
      - name: Require executed fixtures and gate summary
        run: |
          test -s eval-output.log
          grep -qE '^\[eval\] .+ passRate=' eval-output.log
          grep -qE '^\[eval:gates\] hard-gated [1-9][0-9]*/[1-9][0-9]*' eval-output.log
      - name: Eval summary
        if: always()
        run: |
          {
            echo "## Core dashboard eval results"
            echo '```'
            grep -E '^\[eval(:summary|:gates|:cache|:usage)?\]' eval-output.log || echo "(required gate summary absent)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop test services
        if: always()
        run: npm run test:services:down

  core-gateway:
    name: Gateway pre-filter and clear-fraud gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_RETRY_HARD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require model credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ "$ANTHROPIC_API_KEY" = "test-anthropic-key" ]; then
            echo "ANTHROPIC_API_KEY must be configured with a real key; skipped model evals cannot pass."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Start test services
        run: npm run test:services:up
      - name: Bootstrap test database
        run: node ./scripts/test-bootstrap.mjs
      - name: Run deterministic gateway pre-filter
        run: |
          set -o pipefail
          npm run test:evals -w apps/gateway -- -t "order-ops deterministic pre-filter" 2>&1 | tee gateway-eval.log
      - name: Run clear-fraud model gate
        run: |
          set -o pipefail
          npm run test:evals -w apps/gateway -- -t "clear-fraud-multi-signal" 2>&1 | tee -a gateway-eval.log
      - name: Require gateway gate summary
        run: |
          test -s gateway-eval.log
          grep -q 'order-ops deterministic pre-filter' gateway-eval.log
          grep -qE '^\[order-ops-eval:gates\] clear-fraud (1/1|retries 2/2)' gateway-eval.log
      - name: Stop test services
        if: always()
        run: npm run test:services:down

  full-nightly:
    name: Full dashboard and gateway drift suite
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_SUITE: full
      EVAL_REPEATS: '1'
      RUN_JUDGE_EVALS: '1'
      REQUIRE_MODEL_EVALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require model credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ "$ANTHROPIC_API_KEY" = "test-anthropic-key" ]; then
            echo "ANTHROPIC_API_KEY must be configured with a real key."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Start test services
        run: npm run test:services:up
      - name: Bootstrap test database
        run: node ./scripts/test-bootstrap.mjs
      - name: Run full dashboard suite with semantic judge
        run: |
          set -o pipefail
          npm run test:evals -w apps/dashboard 2>&1 | tee eval-output.log
      - name: Run full gateway suite
        run: |
          set -o pipefail
          npm run test:evals -w apps/gateway 2>&1 | tee gateway-eval.log
      - name: Nightly drift summary
        if: always()
        run: |
          {
            echo "## Full nightly eval drift"
            echo '```'
            grep -E '^(\[eval(:summary|:gates|:cache|:usage|:baseline)?\]|  [a-zA-Z~])' eval-output.log || echo "(dashboard summary absent)"
            grep -E '^\[order-ops-eval' gateway-eval.log || echo "(gateway summary absent)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop test services
        if: always()
        run: npm run test:services:down

  regenerate-baseline:
    name: Regenerate full three-run baseline
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_SUITE: full
      EVAL_REPEATS: '3'
      RUN_JUDGE_EVALS: '1'
      UPDATE_EVAL_BASELINE: '1'
      REQUIRE_MODEL_EVALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require model credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ "$ANTHROPIC_API_KEY" = "test-anthropic-key" ]; then
            echo "ANTHROPIC_API_KEY must be configured with a real key."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Start test services
        run: npm run test:services:up
      - name: Bootstrap test database
        run: node ./scripts/test-bootstrap.mjs
      - name: Verify code before replacing the baseline
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:integration
      - name: Run full dashboard suite three times and write baseline
        run: npm run test:evals:baseline -w apps/dashboard
      - name: Run full gateway suite three times
        run: |
          for attempt in 1 2 3; do
            npm run test:evals -w apps/gateway
          done
      - name: Commit regenerated baseline
        run: |
          if git diff --quiet -- apps/dashboard/src/lib/agent/__evals__/baseline.json; then
            echo "Baseline was unchanged."
            exit 0
          fi
          git config user.name "shopkeeper-eval-bot"
          git config user.email "shopkeeper-eval-bot@users.noreply.github.com"
          git add apps/dashboard/src/lib/agent/__evals__/baseline.json
          git commit -m "chore(evals): regenerate full baseline"
          git push
      - name: Stop test services
        if: always()
        run: npm run test:services:down

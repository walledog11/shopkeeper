# Google's mirror of Docker Hub official images; same digests as docker.io and
# public.ecr.aws. public.ecr.aws refused CI pulls with "toomanyrequests: Data
# limit exceeded" on shared GitHub runners, which failed runs before any test.
services:
  postgres:
    image: mirror.gcr.io/library/postgres:16
    container_name: clerk-test-postgres
    environment:
      POSTGRES_DB: clerk_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clerk_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - clerk-test-postgres-data:/var/lib/postgresql/data

  redis:
    image: mirror.gcr.io/library/redis:7
    container_name: clerk-test-redis
    # Dev queues use DB 1; tests use DB 0. Keep dev jobs across container restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - clerk-local-redis-data:/data
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clerk-test-postgres-data:
  clerk-local-redis-data:

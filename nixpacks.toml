[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install"]

[phases.build]
# turbo orders workspace builds from each package's own dependencies. A literal
# sequence here is a second copy of the dependency graph and goes stale the
# moment a package gains a workspace dependency — which is how a gateway deploy
# broke on `@shopkeeper/email` importing `@shopkeeper/agent`.
cmds = ["npx turbo run build --filter=shopkeeper-gateway"]

[start]
cmd = "npm run start -w apps/gateway"
